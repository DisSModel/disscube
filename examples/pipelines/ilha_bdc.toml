# Example 07 as a pipeline file: Brazil Data Cube drivers over Ilha do Maranhão.
# Needs network and `pip install -e ".[bdc]"`.
#
#     disscube run examples/pipelines/ilha_bdc.toml --workspace outputs/ilha_bdc

schema = 1
name = "Ilha do Maranhão — BDC Landsat drivers, dry season 2020"

[grid]
name = "ilha_do_maranhao"
bbox = [-44.35, -2.62, -44.20, -2.47]      # WGS84; grid in BDC Albers, snapped
resolution = 300

[[source]]
id = "ndvi"
type = "bdc"
collection = "LANDSAT-16D-1"
asset = "NDVI"
period = "2020-07-01/2020-09-30"
scale = 1e-4                               # BDC stores indices as int16 × 10 000

[[source]]
id = "mndwi"
type = "bdc"
collection = "LANDSAT-16D-1"
normalized_difference = ["green", "swir16"]
period = "2020-07-01/2020-09-30"

[[derive]]
target = "ndvi_mean"
source = "ndvi"
operator = "mean"

[[derive]]
target = "mndwi_mean"
source = "mndwi"
operator = "mean"
