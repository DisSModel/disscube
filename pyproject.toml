[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disscube"
version = "0.5.0"
description = "Declarative spatial data cubes: describe sources, grid and derived variables in TOML; get a cataloged, reproducible cube."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sérgio Souza Costa" }
]
maintainers = [
    { name = "Sérgio Souza Costa" }
]
license = { text = "MIT" }
keywords = [
    "spatial data cube",
    "geospatial",
    "land use and land cover change",
    "brazil data cube",
    "reproducibility",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.0",
    "xarray",
    "zarr",
    "rasterio",
    "geopandas",
    "shapely",
    "scipy",
    "numpy",
    "pandas",
    "pyproj",
    "fsspec",
    "toml",
    "rioxarray",
    "affine",
    "pooch>=1.8.0",
]

[project.scripts]
disscube = "disscube.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy>=1.13",
    "ruff>=0.16,<0.17",
    "ipykernel",
]
bdc = [
    "fiona",
    "pystac-client",        # disscube.sources.bdc: searching the BDC STAC catalog
]
s3 = [
    "s3fs",
]
netcdf = [                  # CubeClient.export_netcdf()
    "h5netcdf",
    "h5py",
]
dissmodel = [               # CubeClient.to_raster_backend(): hand-off to DisSModel models
    "dissmodel>=0.6.0,<0.7.0",
]
docs = [                    # documentation site (mkdocs.yml, .github/workflows/docs.yml)
    "mkdocs>=1.6,<2",       # MkDocs 2.0 drops the plugin/theme system Material relies on
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/DisSModel/disscube"
Repository = "https://github.com/DisSModel/disscube"
Documentation = "https://dissmodel.github.io/disscube/"
Issues = "https://github.com/DisSModel/disscube/issues"
Changelog = "https://github.com/DisSModel/disscube/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["disscube*"]

[tool.setuptools.package-data]
disscube = ["data/bdc_grids/*.zip", "data/bdc_grids/README.md"]

[tool.ruff]
# Same policy as DisSModel/dissmodel: no explicit `select`, lint with ruff's
# own default rule set for the pinned minor version (see the `ruff` pin in
# the `dev` extra). If bumping that pin changes CI results, reconcile by
# fixing the code or, for a rule that is a bad fit, adding it to an explicit
# `ignore` here — not by re-pinning silently.
# line-length is informational: E501 is not in the default rules.
line-length = 120
target-version = "py311"
exclude = ["docs", "site", "build"]

[tool.ruff.lint.isort]
known-first-party = ["disscube"]


[tool.mypy]
python_version = "3.12"
exclude = ["tests/", "docs/", "examples/"]

[[tool.mypy.overrides]]
# Third-party (or optional-extra) dependencies with no bundled type stubs.
# Deliberately per-module, not a blanket `ignore_missing_imports` at the top
# level: a global setting also silences typos in *our own* first-party import
# paths (same policy as DisSModel/dissmodel). Add a module here only when it
# genuinely has no stubs.
module = [
    "geopandas.*",
    "pandas.*",
    "shapely.*",
    "scipy.*",
    "rasterio.*",
    "fsspec.*",
    "pooch.*",
    "dissmodel.*",         # sibling package, ships no py.typed marker yet
    "toml",
    "fiona.*",             # optional [bdc] extra
    "pystac_client.*",     # optional [bdc] extra
    "s3fs.*",              # optional [s3] extra
    "h5netcdf.*",          # optional [netcdf] extra
    "h5py.*",              # optional [netcdf] extra
    "netCDF4.*",           # optional netCDF backend (export_netcdf)
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zarr 3.x ships py.typed source using PEP 695 syntax (Python 3.12+), which
# mypy cannot parse under python_version = "3.11". Never analyze it.
module = ["zarr.*"]
follow_imports = "skip"
ignore_errors = true
