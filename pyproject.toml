[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disscube"
version = "0.2.0"
description = "Declarative Spatial Layer for Dynamic Models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sérgio Costa" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.0",
    "xarray",
    "zarr",
    "rasterio",
    "geopandas",
    "shapely",
    "scipy",
    "numpy",
    "pandas",
    "pyproj",
    "fsspec",
    "toml",
    "rioxarray",
    "affine",
    "dissmodel>=0.6.0,<0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.16,<0.17",     # pinned minor: ruff's default rule set grows across versions
    "httpx",                # required by fastapi.testclient in tests/test_api.py
    "ipykernel",
]
bdc = [
    "fiona",
    "pystac-client",        # disscube.utils.bdc_stac: searching the BDC STAC catalog
]
s3 = [
    "s3fs",
]
docs = [                    # documentation site (mkdocs.yml, .github/workflows/docs.yml)
    "mkdocs>=1.6,<2",       # MkDocs 2.0 drops the plugin/theme system Material relies on
    "mkdocs-material>=9.5",
]
api = [                     # experimental HTTP API (disscube.api)
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["disscube*"]

[tool.setuptools.package-data]
disscube = ["data/bdc_grids/*.zip", "data/bdc_grids/README.md"]

[tool.ruff]
# Same policy as DisSModel/dissmodel: no explicit `select`, lint with ruff's
# own default rule set for the pinned minor version (see the `ruff` pin in
# the `dev` extra). If bumping that pin changes CI results, reconcile by
# fixing the code or, for a rule that is a bad fit, adding it to an explicit
# `ignore` here — not by re-pinning silently.
# line-length is informational: E501 is not in the default rules.
line-length = 120
target-version = "py311"
exclude = ["docs", "site", "build"]
