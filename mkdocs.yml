site_name: DisSCube
site_description: "Spatial data cube engine of the DisSModel ecosystem: declarative pipelines that turn raster and vector sources into model-ready grids."
site_author: "LambdaGeo / UFMA"
site_url: https://dissmodel.github.io/disscube/
repo_url: https://github.com/DisSModel/disscube
repo_name: DisSModel/disscube
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - javascripts/mathjax-config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting started:
      - Examples: examples.md
  - Guides:
      - Pipeline files (TOML): guides/pipeline_files.md
      - Command line: guides/cli.md
      - Block-wise reading: guides/blocks.md
      - BDC Integration: guides/bdc.md
      - MapBiomas: guides/mapbiomas.md
      - "Land-cover maps: PRODES and SITS": guides/landcover.md
      - "OpenStreetMap": guides/osm.md
      - "Elevation and slope (DEM)": guides/dem.md
      - Custom Grids: guides/grids.md
  - Architecture:
      - Overview: architecture/overview.md
      - Operator System: architecture/operators.md
      - Catalog & Persistence: architecture/catalog.md
      - Pipeline Stages: architecture/pipeline.md
      - Master Grids & Tiling: architecture/tiling.md
  - Validation:
      - "TerraME Fill Cells correspondence": terrame_fill_correspondence.md
