site_name: DisSCube Documentation
site_description: Spatial data cube engine of the DisSModel ecosystem
site_url: https://dissmodel.github.io/disscube/
repo_url: https://github.com/DisSModel/disscube
repo_name: DisSModel/disscube
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Examples: examples.md
  - Architecture:
      - Overview: architecture/overview.md
      - Operator System: architecture/operators.md
      - Catalog & Persistence: architecture/catalog.md
      - Pipeline Stages: architecture/pipeline.md
      - Master Grids & Tiling: architecture/tiling.md
      - TerraME Fill Cells Correspondence: terrame_fill_correspondence.md
  - Guides:
      - Pipeline files (TOML): guides/pipeline_files.md
      - BDC Integration: guides/bdc.md
      - MapBiomas: guides/mapbiomas.md
      - "Land-cover maps: PRODES and SITS": guides/landcover.md
      - Custom Grids: guides/grids.md
