name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allows running the workflow manually

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        # keep in sync with the `ruff` pin in pyproject.toml's `dev` extra
        run: pip install "ruff>=0.16,<0.17"

      - name: Run Ruff
        run: ruff check disscube/

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bdc,api]"

      # Coverage XML is produced but not uploaded anywhere yet.
      - name: Run tests with coverage
        run: pytest tests/ --cov=disscube --cov-report=term-missing --cov-report=xml

  test-minimal:
    # Core install without optional extras: checks that tests depending on
    # optional packages (fiona via disscube[bdc], fastapi via disscube[api])
    # are skipped, not failed.
    name: test (core install, no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -rs
